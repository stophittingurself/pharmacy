# ============================================================
# Ansible Inventory — список серверов
#
# Замени IP-адреса на свои
# Группы:
#   - k8s_masters: ноды control plane
#   - k8s_workers: worker ноды
#   - monitoring: сервер мониторинга (если отдельный)
# ============================================================

[k8s_masters]
master-1 ansible_host=10.0.1.10

[k8s_workers]
worker-1 ansible_host=10.0.1.21
worker-2 ansible_host=10.0.1.22
worker-3 ansible_host=10.0.1.23

[monitoring]
mon-1 ansible_host=10.0.1.30

# ─── Общие переменные ───
[all:vars]
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/pharmacy_deploy
ansible_python_interpreter=/usr/bin/python3

# Группа всех K8s нод
[k8s:children]
k8s_masters
k8s_workers
