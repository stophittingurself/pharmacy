# ============================================================
# docker/tasks/main.yml — Установка Docker + containerd
#
# Зачем: Docker нужен для сборки образов на CI runner'ах
# containerd — как container runtime для K8s
# ============================================================

---
- name: Удалить старые версии Docker
  apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent
  ignore_errors: yes

- name: Добавить Docker GPG ключ
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Добавить Docker apt репозиторий
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    update_cache: yes

- name: Установить Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Запустить и включить Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Добавить deploy-пользователя в группу docker
  user:
    name: deploy
    groups: docker
    append: yes

# ─── containerd конфигурация для K8s ───
- name: Создать дефолтный containerd config
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Включить SystemdCgroup в containerd
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup'
    line: '            SystemdCgroup = true'
  notify: restart containerd

# ─── Docker daemon config ───
- name: Настроить Docker daemon (log rotation, registry)
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        },
        "insecure-registries": ["harbor.pharmacy.local"],
        "storage-driver": "overlay2"
      }
  notify: restart docker

handlers:
  - name: restart docker
    systemd:
      name: docker
      state: restarted

  - name: restart containerd
    systemd:
      name: containerd
      state: restarted
