# ============================================================
# Secrets — хранение паролей
#
# ВАЖНО: В реальном проде НЕ храни пароли в values.yaml!
# Используй:
#   - Sealed Secrets (bitnami) — шифрует секреты в Git
#   - External Secrets Operator — тянет из Vault / AWS SSM
#   - SOPS — шифрование файлов в Git
#
# Сейчас для практики — plain text в values (это нормально для dev)
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
  labels:
    app: {{ .Release.Name }}
type: Opaque
data:
  username: {{ .Values.postgres.credentials.username | b64enc }}
  password: {{ .Values.postgres.credentials.password | b64enc }}
  database-url: {{ .Values.backend.env.DATABASE_URL | b64enc }}
