# ============================================================
# values-prod.yaml — Production окружение
# Максимальная надёжность, ресурсы, TLS, строгие политики
# ============================================================

backend:
  replicaCount: 3
  image:
    pullPolicy: Always  # Всегда тянем свежий образ
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

frontend:
  replicaCount: 3
  image:
    pullPolicy: Always
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

postgres:
  storage: 50Gi
  # В реальном проде используй managed PostgreSQL (AWS RDS / Yandex MDB)
  # и отключай этот StatefulSet:
  # enabled: false

ingress:
  host: pharmacy.local
  tls: true
  # tlsSecretName: pharmacy-tls-cert  # cert-manager

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPU: 65
  targetMemory: 75

networkPolicy:
  enabled: true
