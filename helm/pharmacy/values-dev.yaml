# ============================================================
# values-dev.yaml — Dev окружение
# Минимальные ресурсы, 1 реплика, без TLS
# ============================================================

backend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

postgres:
  storage: 5Gi

ingress:
  host: dev.pharmacy.local
  tls: false

hpa:
  enabled: false  # В dev не нужен автоскейлинг

networkPolicy:
  enabled: false  # В dev не ограничиваем для удобства отладки
