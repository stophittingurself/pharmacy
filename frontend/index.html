<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EuroPharm — Панель управления</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #fff; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { font-size: 24px; }
        .header .status { font-size: 14px; opacity: 0.9; }
        .status-dot { display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; background: #4caf50; margin-right: 6px; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .stat-card .label { font-size: 13px; color: #666; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 700; color: #1a73e8; }

        .section { background: #fff; border-radius: 12px; padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .section h2 { font-size: 18px; margin-bottom: 16px; color: #1a73e8; }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { font-size: 12px; text-transform: uppercase; color: #888;
            letter-spacing: 0.5px; background: #fafafa; }
        tr:hover { background: #f5f8ff; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px;
            font-size: 12px; font-weight: 600; }
        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-yellow { background: #fff8e1; color: #f57f17; }
        .badge-red { background: #ffebee; color: #c62828; }

        .price { font-weight: 600; }

        .add-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .add-form input, .add-form select {
            padding: 10px 14px; border: 1px solid #ddd;
            border-radius: 8px; font-size: 14px; }
        .add-form button {
            padding: 10px 24px; background: #1a73e8; color: #fff;
            border: none; border-radius: 8px; font-size: 14px;
            cursor: pointer; font-weight: 600; }
        .add-form button:hover { background: #1557b0; }

        .error { color: #c62828; font-size: 14px; margin: 10px 0; }
        .loading { text-align: center; padding: 40px; color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>EuroPharm — Аптечная сеть</h1>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Подключение...</span>
        </div>
    </div>

    <div class="container">
        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="label">Аптек в сети</div>
                <div class="value" id="pharmacyCount">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Позиций в каталоге</div>
                <div class="value" id="medicineCount">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Общий остаток (шт)</div>
                <div class="value" id="totalStock">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Средняя цена (₸)</div>
                <div class="value" id="avgPrice">—</div>
            </div>
        </div>

        <div class="section">
            <h2>Добавить лекарство</h2>
            <div class="add-form">
                <input type="text" id="medName" placeholder="Название">
                <input type="text" id="medCategory" placeholder="Категория">
                <input type="number" id="medPrice" placeholder="Цена (₸)" step="0.01">
                <input type="number" id="medStock" placeholder="Кол-во">
                <select id="medPharmacy"></select>
                <button onclick="addMedicine()">Добавить</button>
            </div>
            <div class="error" id="formError"></div>
        </div>

        <div class="section">
            <h2>Каталог лекарств</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Категория</th>
                        <th>Цена</th>
                        <th>Остаток</th>
                        <th>Аптека</th>
                    </tr>
                </thead>
                <tbody id="medicineTable">
                    <tr><td colspan="6" class="loading">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="section">
            <h2>Аптеки</h2>
            <table>
                <thead>
                    <tr><th>ID</th><th>Название</th><th>Адрес</th><th>Телефон</th></tr>
                </thead>
                <tbody id="pharmacyTable">
                    <tr><td colspan="4" class="loading">Загрузка...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // API_URL берётся из env — в Docker/K8s будет /api, при локальной разработке localhost:8000
        const API_URL = window.API_URL || '/api';

        let pharmacies = [];

        async function checkHealth() {
            try {
                const res = await fetch(`${API_URL}/health`);
                const data = await res.json();
                document.getElementById('statusDot').style.background = '#4caf50';
                document.getElementById('statusText').textContent = 'API: Online';
            } catch {
                document.getElementById('statusDot').style.background = '#c62828';
                document.getElementById('statusText').textContent = 'API: Offline';
            }
        }

        async function loadPharmacies() {
            try {
                const res = await fetch(`${API_URL}/pharmacies`);
                pharmacies = await res.json();
                const tbody = document.getElementById('pharmacyTable');
                tbody.innerHTML = pharmacies.map(p => `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.address}</td>
                        <td>${p.phone}</td>
                    </tr>
                `).join('');

                document.getElementById('pharmacyCount').textContent = pharmacies.length;

                const select = document.getElementById('medPharmacy');
                select.innerHTML = pharmacies.map(p =>
                    `<option value="${p.id}">${p.name}</option>`
                ).join('');
            } catch (e) {
                console.error('Failed to load pharmacies:', e);
            }
        }

        async function loadMedicines() {
            try {
                const res = await fetch(`${API_URL}/medicines`);
                const medicines = await res.json();
                const tbody = document.getElementById('medicineTable');

                tbody.innerHTML = medicines.map(m => {
                    let stockBadge = 'badge-green';
                    if (m.stock < 20) stockBadge = 'badge-red';
                    else if (m.stock < 50) stockBadge = 'badge-yellow';

                    const pharmacy = pharmacies.find(p => p.id === m.pharmacy_id);
                    return `
                        <tr>
                            <td>${m.id}</td>
                            <td>${m.name}</td>
                            <td>${m.category}</td>
                            <td class="price">${m.price.toLocaleString()} ₸</td>
                            <td><span class="badge ${stockBadge}">${m.stock} шт</span></td>
                            <td>${pharmacy ? pharmacy.name : m.pharmacy_id}</td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('medicineCount').textContent = medicines.length;
                const totalStock = medicines.reduce((s, m) => s + m.stock, 0);
                document.getElementById('totalStock').textContent = totalStock.toLocaleString();
                const avgPrice = medicines.length
                    ? Math.round(medicines.reduce((s, m) => s + m.price, 0) / medicines.length)
                    : 0;
                document.getElementById('avgPrice').textContent = avgPrice.toLocaleString();
            } catch (e) {
                console.error('Failed to load medicines:', e);
            }
        }

        async function addMedicine() {
            const payload = {
                name: document.getElementById('medName').value,
                category: document.getElementById('medCategory').value,
                price: parseFloat(document.getElementById('medPrice').value),
                stock: parseInt(document.getElementById('medStock').value),
                pharmacy_id: parseInt(document.getElementById('medPharmacy').value),
            };

            if (!payload.name || !payload.category || isNaN(payload.price) || isNaN(payload.stock)) {
                document.getElementById('formError').textContent = 'Заполните все поля';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/medicines`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error(await res.text());

                document.getElementById('formError').textContent = '';
                ['medName', 'medCategory', 'medPrice', 'medStock'].forEach(
                    id => document.getElementById(id).value = ''
                );
                await loadMedicines();
            } catch (e) {
                document.getElementById('formError').textContent = `Ошибка: ${e.message}`;
            }
        }

        // Init
        checkHealth();
        loadPharmacies().then(loadMedicines);
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
