# ============================================================
# Nginx — раздаёт статику фронта + проксирует /api на бэкенд
# В K8s бэкенд будет доступен через Service (pharmacy-backend)
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Статика фронтенда
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API-запросов на бэкенд
    # В Docker Compose: backend:8000
    # В K8s: pharmacy-backend.{{ .Release.Namespace }}.svc.cluster.local:8000
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Prometheus метрики бэкенда (для Prometheus scrape)
    location /metrics {
        proxy_pass http://backend:8000/metrics;
    }

    # Gzip-сжатие
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;
}
